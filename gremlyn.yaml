version: 1
mode: shield

servers:
  demo-server:
      mode: proxy
      rules:
        - name: block-prompt-injection
          detect: ["prompt_injection"]
          action: block_and_alert
        - name: log-all
          action: log_only
  remote-server:
      mode: proxy
      upstream: http://localhost:3001 #npx -y @modelcontextprotocol/server-everything sse --port 3001
      rules:
        - name: block-prompt-injection
          detect: ["prompt_injection"]
          action: block_and_alert
  filesystem-server:
    mode: wrap
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
    rules:
      - name: log-all
        action: log_only

  cloud-demo:
    mode: cloud
    upstream: http://localhost:3001
    auth_header: "Bearer sk-test-fake-key-12345"
    headers:
      X-Custom-Header: "gremlyn"
    rules:
      - name: log-all
        action: log_only

global:
  alert_channels: []
