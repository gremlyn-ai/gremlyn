version: 2

project_name: gremlyn

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: gremlyn
    main: ./cmd/gremlyn
    binary: gremlyn
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/gremlyn-ai/gremlyn/internal/cli.Version={{.Version}}
      - -X github.com/gremlyn-ai/gremlyn/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/gremlyn-ai/gremlyn/internal/cli.BuildDate={{.Date}}

archives:
  - id: default
    ids: [gremlyn]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Breaking changes
      regexp: '(?i)^\W*\w+(\([^)]*\))?!:|BREAKING'
      order: 0
    - title: Features
      regexp: '(?i)^\W*feat'
      order: 1
    - title: Fixes
      regexp: '(?i)^\W*fix'
      order: 2
    - title: Performance
      regexp: '(?i)^\W*perf'
      order: 3
    - title: Other
      order: 99
  filters:
    exclude:
      - '(?i)^\W*docs'
      - '(?i)^\W*test'
      - '(?i)^\W*style'
      - '(?i)^\W*chore\(deps\)'
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  footer: |

    ```bash
    go install github.com/gremlyn-ai/gremlyn/cmd/gremlyn@{{ .Tag }}
    ```

    Or download a binary below and verify it:

    ```bash
    sha256sum -c checksums.txt --ignore-missing
    ```
