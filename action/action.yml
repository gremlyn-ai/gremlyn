name: Gremlyn Arena
description: Break your AI agent on purpose on every pull request, and report how it copes as a check and a comment
author: gremlyn-ai
branding:
  icon: zap
  color: red

inputs:
  config:
    description: Path to the Arena scenario config
    required: false
    default: .gremlyn/arena.yaml
  version:
    description: >
      Gremlyn version to install: a tag, "latest", or "path" to use a gremlyn already on
      PATH (built from source or installed with go install) and skip the download.
    required: false
    default: latest
  min-score:
    description: >
      Overall resilience minimum. Overrides thresholds.min_overall in the config
      when set, so a workflow can tighten the bar without editing the config.
    required: false
    default: ""
  report:
    description: Where to write the machine-readable JSON report
    required: false
    default: gremlyn-report.json
  check-run:
    description: >
      Publish the result as a "Gremlyn" check on the pull request, with the full report
      in the Checks tab and an annotation on each failing scenario. Needs `checks: write`.
    required: false
    default: "true"
  comment-on-pr:
    description: "Post the report as a PR comment, updated in place on every push. Needs `pull-requests: write`."
    required: false
    default: "true"
  baseline:
    description: >
      Path to a previous JSON report to compare against. When empty on a pull request,
      the action downloads the `gremlyn-report` artifact of the last successful run of
      this workflow on the base branch, so run the action on pushes to that branch too.
      Needs `actions: read`.
    required: false
    default: ""
  fail-on-threshold:
    description: >
      Fail the job when a threshold is missed. Off by default: an LLM agent is not
      deterministic, so the same scenario can score differently on two runs, and a
      hard gate on one run turns into a flaky check that people disable. The check is
      reported as "neutral" instead. Turn this on once the scores are stable.
    required: false
    default: "false"
  github-token:
    description: "Token used to fetch the baseline, publish the check and comment on the PR"
    required: false
    default: ${{ github.token }}

outputs:
  passed:
    description: Whether every scenario met its thresholds
    value: ${{ steps.run.outputs.passed }}
  score:
    description: Lowest overall resilience score across scenarios
    value: ${{ steps.run.outputs.score }}
  title:
    description: The one-line verdict, e.g. "1 of 3 scenarios below threshold · 1 regression vs base"
    value: ${{ steps.run.outputs.title }}
  report:
    description: Path to the JSON report
    value: ${{ steps.run.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install gremlyn
      if: ${{ inputs.version != 'path' }}
      shell: bash
      env:
        GREMLYN_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/gremlyn-bin"
        mkdir -p "$dir"

        if [ "$GREMLYN_VERSION" = "latest" ]; then
          tag=$(curl -fsSL https://api.github.com/repos/gremlyn-ai/gremlyn/releases/latest \
                | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)
        else
          tag="$GREMLYN_VERSION"
        fi
        [ -n "$tag" ] || { echo "::error::could not determine the gremlyn version to install"; exit 1; }

        case "$(uname -m)" in
          x86_64|amd64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
        esac
        os=$(uname -s | tr '[:upper:]' '[:lower:]')

        num="${tag#v}"
        archive="gremlyn_${num}_${os}_${arch}.tar.gz"
        base="https://github.com/gremlyn-ai/gremlyn/releases/download/${tag}"

        curl -fsSL -o "$dir/$archive" "$base/$archive"

        curl -fsSL -o "$dir/checksums.txt" "$base/checksums.txt"

        if command -v cosign >/dev/null 2>&1 \
           && curl -fsSL -o "$dir/checksums.txt.sig" "$base/checksums.txt.sig" \
           && curl -fsSL -o "$dir/checksums.txt.pem" "$base/checksums.txt.pem"; then
          cosign verify-blob "$dir/checksums.txt" \
            --signature "$dir/checksums.txt.sig" \
            --certificate "$dir/checksums.txt.pem" \
            --certificate-identity-regexp "^https://github.com/gremlyn-ai/gremlyn/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "signature verified"
        else
          echo "::notice::cosign or signature assets unavailable; verifying the checksum only"
        fi

        ( cd "$dir" && sha256sum -c checksums.txt --ignore-missing )

        tar -xzf "$dir/$archive" -C "$dir"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/gremlyn" version

    - name: Check the preinstalled gremlyn
      if: ${{ inputs.version == 'path' }}
      shell: bash
      run: |
        command -v gremlyn >/dev/null || { echo "::error::version: path, but no gremlyn on PATH"; exit 1; }
        gremlyn version

    - name: Run Arena
      id: run
      shell: bash
      env:
        CONFIG: ${{ inputs.config }}
        REPORT: ${{ inputs.report }}
        MIN_SCORE: ${{ inputs.min-score }}
        BASELINE: ${{ inputs.baseline }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -uo pipefail

        if [ ! -f "$CONFIG" ]; then
          echo "::error::config not found: $CONFIG"
          exit 1
        fi

        if [ -n "$MIN_SCORE" ]; then
          python3 - "$CONFIG" "$MIN_SCORE" <<'PY'
        import sys, re, pathlib
        path, minimum = sys.argv[1], sys.argv[2]
        p = pathlib.Path(path)
        text = p.read_text()
        if re.search(r'^\s*min_overall:', text, re.M):
            text = re.sub(r'^(\s*)min_overall:.*$', rf'\1min_overall: {minimum}', text, flags=re.M)
        elif re.search(r'^thresholds:', text, re.M):
            text = re.sub(r'^(thresholds:)\s*$', rf'\1\n  min_overall: {minimum}', text, flags=re.M)
        else:
            text += f"\nthresholds:\n  min_overall: {minimum}\n"
        p.write_text(text)
        PY
        fi

        set +e
        gremlyn arena ci --config "$CONFIG" --format text --out "$REPORT"
        status=$?
        set -e

        passed=true
        [ "$status" -eq 0 ] || passed=false
        if [ ! -f "$REPORT" ]; then
          echo "::error::gremlyn arena ci produced no report (exit $status)"
          exit 1
        fi

        if [ -z "$BASELINE" ] && [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && command -v gh >/dev/null 2>&1; then
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --branch "$GITHUB_BASE_REF" \
                     --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$run_id" ] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
               -n gremlyn-report -D "$RUNNER_TEMP/gremlyn-baseline" >/dev/null 2>&1; then
            BASELINE="$RUNNER_TEMP/gremlyn-baseline/$(basename "$REPORT")"
            echo "baseline: run $run_id on $GITHUB_BASE_REF"
          else
            echo "::notice::no baseline report found on $GITHUB_BASE_REF; the delta column stays empty"
          fi
        fi

        base_args=()
        [ -n "$BASELINE" ] && [ -f "$BASELINE" ] && base_args=(--baseline "$BASELINE")
        md="$RUNNER_TEMP/gremlyn-summary.md"
        gremlyn arena report "$REPORT" "${base_args[@]}" > "$md"
        title=$(gremlyn arena report "$REPORT" "${base_args[@]}" --title)
        cat "$md" >> "$GITHUB_STEP_SUMMARY"

        {
          echo "passed=$passed"
          echo "report=$REPORT"
          echo "summary=$md"
          echo "title=$title"
          echo "score=$(jq '[.scenarios[].report.overall] | min // empty' "$REPORT")"
        } >> "$GITHUB_OUTPUT"

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gremlyn-report
        path: ${{ inputs.report }}
        if-no-files-found: warn

    - name: Publish the Gremlyn check
      if: ${{ always() && inputs.check-run == 'true' && steps.run.outputs.summary != '' }}
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      env:
        SUMMARY: ${{ steps.run.outputs.summary }}
        TITLE: ${{ steps.run.outputs.title }}
        PASSED: ${{ steps.run.outputs.passed }}
        REPORT: ${{ steps.run.outputs.report }}
        CONFIG: ${{ inputs.config }}
        FAIL_ON_THRESHOLD: ${{ inputs.fail-on-threshold }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const passed = process.env.PASSED === 'true';
          const conclusion = passed ? 'success'
            : (process.env.FAIL_ON_THRESHOLD === 'true' ? 'failure' : 'neutral');

          let summary = fs.readFileSync(process.env.SUMMARY, 'utf8');
          if (summary.length > 65000) summary = summary.slice(0, 65000) + '\n\n…truncated, see the job summary.';

          const report = JSON.parse(fs.readFileSync(process.env.REPORT, 'utf8'));
          const configLines = fs.existsSync(process.env.CONFIG)
            ? fs.readFileSync(process.env.CONFIG, 'utf8').split('\n') : [];
          const annotations = report.scenarios
            .filter(s => (s.failures || []).length > 0)
            .slice(0, 50)
            .map(s => {
              const idx = configLines.findIndex(l => new RegExp(`^\\s*-?\\s*name:\\s*["']?${s.name}["']?\\s*$`).test(l));
              const line = idx >= 0 ? idx + 1 : 1;
              const measured = s.report && s.report.measured;
              return {
                path: process.env.CONFIG, start_line: line, end_line: line,
                annotation_level: measured ? 'failure' : 'warning',
                title: `${s.name}: ${measured ? `resilience ${s.report.overall}` : 'nothing measured'}`,
                message: s.failures.join('\n'),
              };
            });

          const pr = context.payload.pull_request;
          try {
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'Gremlyn',
              head_sha: pr ? pr.head.sha : context.sha,
              status: 'completed',
              conclusion,
              output: { title: process.env.TITLE || 'Gremlyn', summary, annotations },
            });
          } catch (e) {
            core.notice(`Could not publish the Gremlyn check (${e.status || e.message}). Grant "checks: write" to enable it.`);
          }

    - name: Comment on the PR
      if: ${{ always() && inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' && steps.run.outputs.summary != '' }}
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      env:
        SUMMARY: ${{ steps.run.outputs.summary }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          if (!fs.existsSync(process.env.SUMMARY)) return;
          const body = fs.readFileSync(process.env.SUMMARY, 'utf8') + '\n<!-- gremlyn-arena -->\n';

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number, per_page: 100,
          });
          const mine = comments.find(c => c.body && c.body.includes('<!-- gremlyn-arena -->'));
          try {
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }
          } catch (e) {
            core.notice(`Could not comment on the PR (${e.status || e.message}). Grant "pull-requests: write" to enable it.`);
          }

    - name: Gate
      if: ${{ inputs.fail-on-threshold == 'true' && steps.run.outputs.passed == 'false' }}
      shell: bash
      env:
        TITLE: ${{ steps.run.outputs.title }}
      run: |
        echo "::error::Resilience thresholds not met: $TITLE"
        exit 1
