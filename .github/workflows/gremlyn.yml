name: Gremlyn

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: gremlyn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arena:
    name: Chaos check on the demo agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build gremlyn from this commit
        run: |
          go build -o "$RUNNER_TEMP/bin/gremlyn" ./cmd/gremlyn
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: ./action
        with:
          version: path
          config: .github/gremlyn-demo.yaml
