name: Gremlyn

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: gremlyn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arena:
    name: Chaos check on the demo agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build gremlyn from this commit
        run: |
          go build -o "$RUNNER_TEMP/bin/gremlyn" ./cmd/gremlyn
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: ./action
        with:
          version: path
          config: .github/gremlyn-demo.yaml
