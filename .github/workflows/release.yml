name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26"
          cache: true

      - name: Gate
        run: |
          go vet ./...
          go test -race -count=1 ./...
          CGO_ENABLED=0 go build ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: "v2.17.1"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published binary
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          num="${tag#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          archive="gremlyn_${num}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" "${base}/${archive}"
          curl -fsSL -o checksums.txt "${base}/checksums.txt"
          curl -fsSL -o checksums.txt.sig "${base}/checksums.txt.sig"
          curl -fsSL -o checksums.txt.pem "${base}/checksums.txt.pem"

          cosign verify-blob checksums.txt \
            --signature checksums.txt.sig \
            --certificate checksums.txt.pem \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          sha256sum -c checksums.txt --ignore-missing
          tar -xzf "$archive"
          ./gremlyn version
          ./gremlyn arena list-gremlins

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
