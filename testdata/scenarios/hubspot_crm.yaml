version: 1
mode: shield

servers:
  hubspot:
    mode: proxy
    upstream: http://localhost:3001
    rules:
      - name: block-bulk-export
        match:
          tool: "search_contacts"
          args.limit: { greater_than: 100 }
        action: block

      - name: block-delete-operations
        match:
          tool: "delete_contact"
        action: block_and_alert

      - name: block-bulk-delete
        match:
          tool: "bulk_delete"
        action: block_and_alert

      - name: scan-response-injections
        scan_responses: true
        detect: ["prompt_injection"]
        action: block_and_alert

      - name: log-all-crm-activity
        action: log_only

global:
  rate_limit: 50/minute/agent
  alert_channels: []
