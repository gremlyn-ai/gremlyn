version: 1
mode: shield

servers:
  slack:
    mode: wrap
    command: npx
    args: ["-y", "@anthropic/mcp-slack"]
    rules:
      - name: redact-pii-outgoing
        scan_outgoing: true
        detect: ["email_address", "phone_number", "credit_card"]
        action: redact

      - name: scan-response-injections
        scan_responses: true
        detect: ["prompt_injection"]
        action: block_and_alert

      - name: log-all-slack-activity
        action: log_only

global:
  alert_channels: []
